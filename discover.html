  <link rel="stylesheet" href="css/discover.css" />

<body>
  <canvas id="petals" aria-hidden="true"></canvas>
  <header class="nav">
    <a class="brand" href="index.html">
      <span class="brand-icon">🎬</span>
      <span class="brand-text">Anime<span class="grad">Pick</span></span>
      <span class="brand-jp">アニメ・ピック</span>
    </a>
    <nav class="nav-links">
      <a href="index.html">开始测试</a>
      <a href="discover.html">💘 发现</a>

  <main class="disc-wrap">
    <div class="disc-head">
      <p class="kicker">✦ DISCOVER ✦</p>
      <h1>从一部「心头好」出发</h1>
      <p class="sub">选一部最近让你 <b>dokidoki kirakira</b>(怦然心动、特别对胃口)的番,从四个维度帮你找下一部。</p>
    </div>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input id="q" type="text" placeholder="输入番名搜索(如:孤独摇滚 / 芙莉莲 / MyGO)…" autocomplete="off" />
    </div>
    <div class="chips" id="chips"></div>
    <div class="sr" id="sr" hidden></div>

    <div class="seed-panel" id="seed-panel" hidden></div>

    <div id="results" hidden>
      <div class="dim" id="dim-all"></div>
      <div class="dim-grid">
        <div class="dim" id="dim-emb"></div>
        <div class="dim" id="dim-co"></div>
        <div class="dim" id="dim-tag"></div>
        <div class="dim" id="dim-proto"></div>
      </div>
    </div>
  </main>

  <script src="js/discover.js"></script>
<footer class="site-foot">
